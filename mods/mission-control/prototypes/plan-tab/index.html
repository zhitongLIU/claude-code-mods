<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Plan</title>
<style>
  :root { --bg:#0d1015; --card:#151922; --card-hi:#1b2130; --line:#2a3140; --text:#e8ebf2; --dim:#7d8698; --faint:#4b5263;
          --edge:#3a4252; --edge-hot:#8fa0c0; --read:#5aa9ff; --edit:#ffa24c; --changed:#3ddc84; --flag:#ff5fa8; --stale:#ffbe3c;
          --http:#5aa9ff; --kafka:#c792ea; --db:#ffa24c; --graphql:#ff7ab8; --email:#7fdbca; --flag-k:#ffbe3c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background-image: radial-gradient(#1a1f28 1px, transparent 1px); background-size: 22px 22px; overflow: hidden; }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  header { display: flex; align-items: center; gap: 10px; padding: 14px 20px; flex-wrap: wrap; }
  h1 { margin: 0 12px 0 0; font-size: 20px; font-weight: 700; }
  .tab, .chip { padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); background: rgba(255,255,255,.02); white-space: nowrap; }
  .tab.on { color: var(--text); border-color: #4a5a78; background: #1a2232; }
  .tab.off { opacity: .45; }
  .chip b { color: var(--text); font-weight: 600; }
  .chip.bad b { color: var(--flag); }
  .hint { margin-left: auto; color: var(--faint); font-size: 12px; }

  #legend { display: flex; gap: 16px; padding: 0 20px 8px; color: var(--dim); font-size: 12px; flex-wrap: wrap; }
  #legend span { display: inline-flex; align-items: center; gap: 6px; }
  #legend svg { overflow: visible; }

  #stage { position: relative; flex: 1; overflow: hidden; cursor: grab; }
  #stage.drag { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #edges path.hit { pointer-events: stroke; cursor: pointer; }

  .lane { position: absolute; border: 1.5px dashed var(--line); border-radius: 18px; background: rgba(255,255,255,.015); }
  .lane-title { position: absolute; left: 18px; top: 10px; font-size: 11.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .col-title { position: absolute; font-size: 11px; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; }

  .card { position: absolute; width: 250px; height: 104px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
          cursor: pointer; transition: border-color .15s, box-shadow .15s, opacity .15s; overflow: hidden; }
  .card:hover { border-color: #4a5a78; }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .card .key { font-weight: 700; font-size: 12.5px; }
  .card .status { margin-left: auto; font-size: 10.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .card .title { margin-top: 5px; font-size: 12px; color: #c4cad6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { position: absolute; left: 14px; right: 14px; bottom: 8px; display: flex; gap: 6px; font-size: 10.5px; color: var(--dim); overflow: hidden; white-space: nowrap; }
  .card .meta span { padding: 0 6px; border-radius: 6px; background: rgba(255,255,255,.04); }
  .card .meta .bad { color: var(--flag); background: rgba(255,95,168,.1); }
  .card.done { opacity: .62; }
  .card.ready { border-color: var(--changed); box-shadow: 0 0 0 1px var(--changed), 0 0 22px rgba(61,220,132,.25); }
  .card.sel { border-color: #9fb4ff; box-shadow: 0 0 0 2px #9fb4ff; opacity: 1; }
  .card.mute { opacity: .25; }
  .card .ready-tag { color: var(--changed); font-weight: 600; }

  .s-done { color: var(--changed); } .s-in_dev, .s-in_review { color: var(--edit); } .s-plan_review { color: var(--read); }
  .s-planning, .s-todo { color: var(--dim); } .s-blocked { color: var(--flag); }

  .elabel { position: absolute; transform: translate(-50%, -50%); padding: 2px 8px; border-radius: 999px; font-size: 10.5px; white-space: nowrap;
            background: #10141b; border: 1px solid var(--edge); color: var(--dim); cursor: pointer; transition: opacity .15s; }
  .elabel:hover { color: var(--text); border-color: var(--edge-hot); }
  .elabel.bad { border-color: var(--flag); color: var(--flag); }
  .elabel { z-index: 3; }
  .k { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

  #drawer { position: absolute; left: 0; right: 0; bottom: 0; height: 46%; background: #0f1319; border-top: 1px solid var(--line);
            transform: translateY(100%); transition: transform .22s ease; display: flex; flex-direction: column; z-index: 5; }
  #drawer.open { transform: none; }
  #drawer .bar { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  #drawer .bar h2 { margin: 0; font-size: 15px; }
  #drawer .bar .x { margin-left: auto; cursor: pointer; color: var(--dim); font-size: 18px; }
  #drawer .body { overflow: auto; padding: 14px 20px 30px; }
  .sec { margin: 4px 0 16px; }
  .sec h3 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .row { display: flex; gap: 8px; align-items: baseline; margin: 3px 0; }
  .row .lbl { color: var(--dim); min-width: 90px; }
  .pill { display: inline-block; padding: 1px 8px; margin: 0 4px 4px 0; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; }
  .pill.declared { border-style: solid; } .pill.extracted { border-style: dashed; } .pill.inferred { border-style: dotted; color: var(--dim); }
  .iface { margin: 0 0 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .iface .id { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .iface .src { color: var(--dim); font-size: 11.5px; margin-left: 6px; }
  .delta { margin: 8px 0 0; padding: 6px 0; border-radius: 6px; background: #0b0e13; font: 12px/1.6 ui-monospace, Menlo, monospace; }
  .delta div { padding: 0 10px; white-space: pre-wrap; }
  .delta .add { color: #7ee2a8; background: rgba(61,220,132,.07); }
  .delta .chg { color: #ffd27a; background: rgba(255,190,60,.07); }
  .delta .del { color: #ff8a8a; background: rgba(255,90,90,.07); }
  .delta .miss { color: var(--flag); background: rgba(255,95,168,.12); }
  .delta .ctx { color: var(--dim); }
  .ev { margin: 6px 0 0; padding-left: 10px; border-left: 2px solid var(--line); color: #aab2c2; font-size: 12px; font-style: italic; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .two h4 { margin: 0 0 4px; font-size: 11.5px; color: var(--dim); font-weight: 600; }
  .warn { color: var(--flag); font-size: 12px; margin-top: 6px; }
  .files code { display: block; color: #aab2c2; font-size: 12px; }
  a.pr { padding: 0 6px; border-radius: 6px; border: 1px solid currentColor; text-decoration: none; font-size: 10.5px; white-space: nowrap; }
  #drawer a.pr { font-size: 12px; padding: 1px 8px; border-radius: 999px; }
  a.pr:hover { background: rgba(255,255,255,.06); }
  .pr-open { color: var(--changed); } .pr-merged { color: #b392f0; } .pr-draft { color: var(--dim); } .pr-closed { color: var(--faint); }
  a.tk { color: inherit; text-decoration: none; }
  a.tk:hover { color: #9fb4ff; text-decoration: underline; }
  .chip.link { cursor: pointer; } .chip.link:hover { border-color: var(--flag); }
  .issue select { margin-left: 8px; background: #0b0e13; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font: inherit; font-size: 12px; }
  #send { background: #2b4fd8; color: #fff; border: 0; border-radius: 8px; padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  .empty { color: var(--faint); }
</style>
</head>
<body>
<header>
  <h1>Mission Control</h1>
  <span class="tab off">Who (w)</span>
  <span class="tab off">Code (c)</span>
  <span class="tab on">Plan (p)</span>
  <span id="chips"></span>
  <span class="hint">scroll zooms · drag pans · click a ticket or an interface · double-click fits · esc closes</span>
</header>
<div id="legend"></div>
<div id="stage">
  <div id="world"><svg id="edges"></svg></div>
  <div id="drawer"><div class="bar"><h2 id="dtitle"></h2><span class="x" id="dclose">✕</span></div><div class="body" id="dbody"></div></div>
</div>

<script src="data.js"></script>
<script>
(function () {
  var PLAN = window.PLAN || { epic: {}, tickets: [], aliases: {} }
  var CARD_W = 250, CARD_H = 104, COL_W = 330, ROW_H = 126, LANE_PAD_TOP = 40, LANE_PAD = 22, LANE_GAP = 26, LEFT = 30, TOP = 40
  var KIND_COLOR = { http: 'var(--http)', kafka: 'var(--kafka)', db: 'var(--db)', graphql: 'var(--graphql)', email: 'var(--email)', flag: 'var(--flag-k)', env: 'var(--flag-k)' }
  var RANK = { declared: 3, extracted: 2, inferred: 1 }

  // ---- model ----
  var alias = PLAN.aliases || {}
  var real = function (k) { return alias[k] || k }
  var tickets = PLAN.tickets
  var byKey = {}
  tickets.forEach(function (t) { byKey[t.key] = t; t.provides = t.provides || []; t.consumes = t.consumes || []; t.blockedBy = t.blockedBy || []; t.files = t.files || []; t.prs = t.prs || [] })

  function kindOf(id) { return String(id).split(' ')[0] }
  function shortId(id) {
    var p = String(id).split(' ')
    if (p[0] === 'http') return p[2] + ' ' + p.slice(3).join(' ').replace(/^\/api\/v\d+\//, '…/')
    if (p[0] === 'kafka') return p.slice(1).join(' ')
    return p.slice(2).join(' ') || p.slice(1).join(' ')
  }
  // the field name a delta line is about: "+ deferred_payment.verification_state: enum" → deferred_payment.verification_state
  function fieldOf(line) { var m = /^[+~-]\s*([^:#\s,]+)/.exec(String(line).trim()); return m ? m[1].replace(/^(response \d+|payload|request)\.?/, '') : null }
  function opOf(line) { var c = String(line).trim()[0]; return c === '+' ? 'add' : c === '~' ? 'chg' : c === '-' ? 'del' : 'ctx' }

  var providersOf = {}
  tickets.forEach(function (t) { t.provides.forEach(function (p) { (providersOf[p.id] = providersOf[p.id] || []).push(t.key) }) })

  var edges = {}
  function edge(from, to) {
    from = real(from); to = real(to)
    if (from === to || !byKey[from] || !byKey[to]) return null
    var k = from + '→' + to
    return edges[k] = edges[k] || { key: k, from: from, to: to, deps: [], ifaces: [] }
  }
  tickets.forEach(function (t) {
    t.blockedBy.forEach(function (b) { var e = edge(b.key, t.key); if (e) e.deps.push(b) })
    t.consumes.forEach(function (c) {
      var froms = c.from ? [c.from] : (providersOf[c.id] || []).filter(function (k) { return k !== t.key })
      froms.forEach(function (f) {
        var e = edge(f, t.key)
        if (!e) return
        var prov = (byKey[real(f)].provides || []).filter(function (p) { return p.id === c.id })[0]
        var provFields = (prov ? prov.delta || [] : []).filter(function (l) { return opOf(l) !== 'del' }).map(fieldOf)
        var miss = (c.delta || []).map(fieldOf).filter(function (f) { return f && provFields.indexOf(f) < 0 })
        e.ifaces.push({ id: c.id, consumer: c, provider: prov || null, missing: prov ? miss : (c.delta || []).map(fieldOf).filter(Boolean), noProvider: !prov })
        if (!c.from) e.deps.push({ key: f, source: 'inferred', evidence: 'same interface id provided by ' + f })
      })
    })
  })
  var edgeList = Object.keys(edges).map(function (k) {
    var e = edges[k]
    e.source = e.deps.reduce(function (best, d) { return RANK[d.source] > RANK[best] ? d.source : best }, e.ifaces.some(function (i) { return i.consumer.from }) ? 'declared' : 'inferred')
    e.done = byKey[e.from].status === 'done'
    e.bad = e.ifaces.some(function (i) { return i.missing.length || i.noProvider })
    return e
  })

  // removed fields a consumer still reads
  tickets.forEach(function (t) {
    t.provides.forEach(function (p) {
      var removed = (p.delta || []).filter(function (l) { return opOf(l) === 'del' }).map(fieldOf)
      if (!removed.length) return
      edgeList.forEach(function (e) {
        if (e.from !== t.key) return
        e.ifaces.forEach(function (i) { if (i.id === p.id) (i.consumer.delta || []).map(fieldOf).forEach(function (f) { if (removed.indexOf(f) >= 0) { i.missing.push(f); (i.removed = i.removed || []).push(f); e.bad = true } }) })
      })
    })
  })

  // An ordering edge already implied by a longer path (A→B→C makes A→C redundant) is hidden until its ticket is selected.
  function reaches(from, to, skip) {
    var seen = {}, stack = [from]
    while (stack.length) {
      var k = stack.pop()
      edgeList.forEach(function (e) {
        if (e.from !== k || e.key === skip || seen[e.to]) return
        seen[e.to] = 1; stack.push(e.to)
      })
    }
    return !!seen[to]
  }
  edgeList.forEach(function (e) { e.redundant = !e.ifaces.length && reaches(e.from, e.to, e.key) })

  // Every mismatch as one finding, the unit that is ticked, given a side to fix, and sent back to Claude.
  var issues = []
  edgeList.forEach(function (e) {
    e.ifaces.forEach(function (i) {
      if (i.noProvider) return issues.push({ kind: 'missing interface', e: e, i: i })
      i.missing.forEach(function (f) { issues.push({ kind: (i.removed || []).indexOf(f) >= 0 ? 'removed field still read' : 'missing field', e: e, i: i, field: f }) })
    })
  })
  issues.forEach(function (x, n) { x.n = n; x.on = true; x.fix = 'decide' })

  tickets.forEach(function (t) {
    var ins = edgeList.filter(function (e) { return e.to === t.key })
    t.ready = t.status !== 'done' && ins.every(function (e) { return e.done })
    t.external = t.consumes.filter(function (c) { return c.existing || (!c.from && !(providersOf[c.id] || []).some(function (k) { return k !== t.key })) })
    t.bad = ins.some(function (e) { return e.bad })
  })

  // ---- layout: columns by dependency depth, one lane per service ----
  var depth = {}
  tickets.forEach(function (t) { depth[t.key] = 0 })
  for (var pass = 0; pass < tickets.length; pass++) {
    var moved = false
    // capped, so a dependency cycle cannot push columns out forever; its edges are drawn going back
    edgeList.forEach(function (e) { if (depth[e.from] + 1 > depth[e.to] && depth[e.from] + 1 < 8) { depth[e.to] = depth[e.from] + 1; moved = true } })
    if (!moved) break
  }
  var services = []
  tickets.forEach(function (t) { if (services.indexOf(t.service) < 0) services.push(t.service) })
  var order = PLAN.serviceOrder || []
  services.sort(function (a, b) { var ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) })
  var maxDepth = Math.max.apply(null, tickets.map(function (t) { return depth[t.key] }))

  var pos = {}, lanes = [], y = TOP + 22
  services.forEach(function (s) {
    var inLane = tickets.filter(function (t) { return t.service === s })
    var stacks = {}
    inLane.forEach(function (t) { (stacks[depth[t.key]] = stacks[depth[t.key]] || []).push(t) })
    var rows = Math.max.apply(null, Object.keys(stacks).map(function (d) { return stacks[d].length }))
    Object.keys(stacks).forEach(function (d) {
      stacks[d].forEach(function (t, i) { pos[t.key] = { x: LEFT + LANE_PAD + Number(d) * COL_W, y: y + LANE_PAD_TOP + i * ROW_H } })
    })
    var h = LANE_PAD_TOP + rows * ROW_H - (ROW_H - CARD_H) + LANE_PAD
    lanes.push({ name: s, y: y, h: h, n: inLane.length })
    y += h + LANE_GAP
  })
  var W = LEFT + LANE_PAD * 2 + (maxDepth + 1) * COL_W - (COL_W - CARD_W), H = y

  // ---- render ----
  var world = document.getElementById('world'), svg = document.getElementById('edges')
  world.style.width = W + 'px'; world.style.height = H + 'px'
  svg.setAttribute('width', W); svg.setAttribute('height', H)

  // A ticket key that opens the ticket in Obeya (or wherever PLAN.ticketUrl points) in a new tab.
  function tk(key, text) {
    var label = esc(text == null ? key : text)
    if (!PLAN.ticketUrl) return label
    return '<a class="tk" href="' + esc(PLAN.ticketUrl.replace('{key}', encodeURIComponent(key))) + '" target="_blank" rel="noopener" title="open ' + esc(key) + ' in Obeya">' + label + '</a>'
  }
  // A pull request badge: "PR #5880" coloured by its state, opening GitHub in a new tab.
  function prLink(pr, long) {
    var text = (long ? pr.repo + ' ' : '') + 'PR #' + pr.number + (long ? ' · ' + pr.state : '')
    return '<a class="pr pr-' + esc(pr.state) + '" href="' + esc(pr.url) + '" target="_blank" rel="noopener" title="' + esc(pr.repo + ' #' + pr.number + ' · ' + pr.state) + '">' + esc(text) + '</a>'
  }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] }) }

  for (var d = 0; d <= maxDepth; d++) {
    var ct = el('div', 'col-title', d === 0 ? 'can start' : 'wave ' + (d + 1))
    ct.style.left = (LEFT + LANE_PAD + d * COL_W) + 'px'; ct.style.top = TOP + 'px'
    world.appendChild(ct)
  }
  lanes.forEach(function (l) {
    var n = el('div', 'lane', '<div class="lane-title">' + esc(l.name) + ' · ' + l.n + '</div>')
    n.style.left = LEFT + 'px'; n.style.top = l.y + 'px'; n.style.width = (W - LEFT) + 'px'; n.style.height = l.h + 'px'
    world.insertBefore(n, svg)
  })

  var cards = {}
  tickets.forEach(function (t) {
    var p = pos[t.key]
    var c = el('div', 'card' + (t.status === 'done' ? ' done' : '') + (t.ready ? ' ready' : ''))
    c.style.left = p.x + 'px'; c.style.top = p.y + 'px'
    var meta = []
    t.prs.forEach(function (pr) { meta.push(prLink(pr)) })
    if (t.ready) meta.push('<span class="ready-tag">ready</span>')
    if (t.provides.length) meta.push('<span>⇢ ' + t.provides.length + ' provides</span>')
    if (t.external.length) meta.push('<span title="existing interfaces it relies on">⇠ ' + t.external.length + ' existing</span>')
    if (t.bad) meta.push('<span class="bad">⚑ mismatch</span>')
    c.innerHTML = '<div class="top"><span class="key">' + tk(t.key) + '</span><span class="status s-' + esc(t.status) + '">' + esc(String(t.status).replace('_', ' ')) + '</span></div>' +
      '<div class="title">' + esc(t.title) + '</div><div class="meta">' + meta.join('') + '</div>'
    c.addEventListener('click', function (ev) { ev.stopPropagation(); if (!ev.target.closest('a')) select({ ticket: t.key }) })
    world.appendChild(c)
    cards[t.key] = c
  })

  var NS = 'http://www.w3.org/2000/svg'
  var defs = document.createElementNS(NS, 'defs')
  ;['norm', 'hot', 'bad', 'done'].forEach(function (k) {
    var m = document.createElementNS(NS, 'marker')
    m.setAttribute('id', 'a-' + k); m.setAttribute('viewBox', '0 0 10 10'); m.setAttribute('refX', '9'); m.setAttribute('refY', '5')
    m.setAttribute('markerWidth', '7'); m.setAttribute('markerHeight', '7'); m.setAttribute('orient', 'auto-start-reverse')
    var p = document.createElementNS(NS, 'path'); p.setAttribute('d', 'M0,0 L10,5 L0,10 z')
    p.setAttribute('fill', k === 'bad' ? '#ff5fa8' : k === 'hot' ? '#8fa0c0' : k === 'done' ? '#3ddc84' : '#4a5468')
    m.appendChild(p); defs.appendChild(m)
  })
  svg.appendChild(defs)

  var edgeEls = {}
  edgeList.forEach(function (e) {
    var a = pos[e.from], b = pos[e.to]
    var x1 = a.x + CARD_W, y1 = a.y + CARD_H / 2, x2 = b.x, y2 = b.y + CARD_H / 2
    var back = x2 <= x1
    if (back) { x1 = a.x + CARD_W / 2; y1 = a.y + (b.y > a.y ? CARD_H : 0); x2 = b.x + CARD_W / 2; y2 = b.y + (b.y > a.y ? 0 : CARD_H) }
    var dx = Math.max(60, Math.abs(x2 - x1) / 2)
    var c = back ? [x1, y1, x1, (y1 + y2) / 2, x2, (y1 + y2) / 2, x2, y2] : [x1, y1, x1 + dx, y1, x2 - dx, y2, x2, y2]
    var d = 'M' + c[0] + ',' + c[1] + ' C' + c.slice(2).join(' ')
    // a point on the curve; labels sit near the consumer so they stay clear of the boxes in between
    function at(t) { var u = 1 - t; return [0, 1].map(function (i) { return u * u * u * c[i] + 3 * u * u * t * c[2 + i] + 3 * u * t * t * c[4 + i] + t * t * t * c[6 + i] }) }
    var path = document.createElementNS(NS, 'path')
    path.setAttribute('d', d); path.setAttribute('fill', 'none')
    var col = e.bad ? '#ff5fa8' : e.done ? '#3ddc84' : '#4a5468' // green: the blocker is done, this link is unlocked
    path.setAttribute('stroke', col); path.setAttribute('stroke-width', e.bad ? 2 : 1.6)
    if (e.source === 'extracted') path.setAttribute('stroke-dasharray', '6 5')
    if (e.source === 'inferred') path.setAttribute('stroke-dasharray', '2 5')
    path.setAttribute('marker-end', 'url(#a-' + (e.bad ? 'bad' : e.done ? 'done' : 'norm') + ')')
    var hit = document.createElementNS(NS, 'path')
    hit.setAttribute('d', d); hit.setAttribute('fill', 'none'); hit.setAttribute('stroke', 'transparent'); hit.setAttribute('stroke-width', 12); hit.setAttribute('class', 'hit')
    hit.addEventListener('click', function (ev) { ev.stopPropagation(); select({ edge: e.key }) })
    svg.appendChild(path); svg.appendChild(hit)
    var lbl = null
    if (e.ifaces.length) {
      var m = at(.8), mx = m[0], my = m[1]
      var first = e.ifaces[0]
      var txt = '<span class="k" style="background:' + (KIND_COLOR[kindOf(first.id)] || 'var(--dim)') + '"></span>' + esc(kindOf(first.id)) + ' ' + esc(shortId(first.id)) + (e.ifaces.length > 1 ? ' +' + (e.ifaces.length - 1) : '')
      lbl = el('div', 'elabel' + (e.bad ? ' bad' : ''), (e.bad ? '⚑ ' : '') + txt)
      lbl.style.left = mx + 'px'; lbl.style.top = my + 'px'
      lbl.addEventListener('click', function (ev) { ev.stopPropagation(); select({ edge: e.key }) })
      world.appendChild(lbl)
    }
    edgeEls[e.key] = { path: path, hit: hit, lbl: lbl, col: col }
  })

  // ---- header ----
  var nDone = tickets.filter(function (t) { return t.status === 'done' }).length
  var nReady = tickets.filter(function (t) { return t.ready }).length
  var nIf = edgeList.reduce(function (s, e) { return s + e.ifaces.length }, 0)
  var nBad = edgeList.filter(function (e) { return e.bad }).length
  var nHidden = edgeList.filter(function (e) { return e.redundant }).length
  document.getElementById('chips').innerHTML =
    '<span class="chip">' + tk(PLAN.epic.key || '') + ' · ' + esc(PLAN.epic.title || '') + '</span> ' +
    '<span class="chip"><b>' + tickets.length + '</b> tickets · <b>' + nDone + '</b> done · <b>' + nReady + '</b> ready</span> ' +
    '<span class="chip" title="ordering edges already implied by a longer path are drawn only when their ticket is selected"><b>' + edgeList.length + '</b> dependencies (' + nHidden + ' implied) · <b>' + nIf + '</b> interfaces</span> ' +
    '<span class="chip link' + (issues.length ? ' bad' : '') + '" id="issues-chip" title="review the mismatches and send them to Claude"><b>' + issues.length + '</b> mismatches ›</span>'
  function legLine(dash, color) { return '<svg width="34" height="8"><line x1="0" y1="4" x2="34" y2="4" stroke="' + color + '" stroke-width="2"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/></svg>' }
  document.getElementById('legend').innerHTML =
    '<span>' + legLine('', '#8fa0c0') + 'declared</span><span>' + legLine('6 5', '#8fa0c0') + 'extracted from prose</span>' +
    '<span>' + legLine('2 5', '#8fa0c0') + 'inferred (same interface)</span><span>' + legLine('', '#3ddc84') + 'unlocked (blocker done)</span>' +
    '<span>' + legLine('', '#ff5fa8') + 'interface mismatch</span>' +
    Object.keys(KIND_COLOR).filter(function (k) { return k !== 'env' }).map(function (k) { return '<span><span class="k" style="background:' + KIND_COLOR[k] + '"></span>' + k + '</span>' }).join('')

  // ---- drawer ----
  var drawer = document.getElementById('drawer'), dtitle = document.getElementById('dtitle'), dbody = document.getElementById('dbody')
  function deltaHtml(lines, missing) {
    if (!lines || !lines.length) return '<div class="delta"><div class="ctx">(no field change listed)</div></div>'
    return '<div class="delta">' + lines.map(function (l) {
      var f = fieldOf(l), miss = missing && f && missing.indexOf(f) >= 0
      return '<div class="' + (miss ? 'miss' : opOf(l)) + '">' + esc(l) + (miss ? '   ⚑ not provided' : '') + '</div>'
    }).join('') + '</div>'
  }
  function depPill(b) { return '<span class="pill ' + esc(b.source) + '" title="' + esc(b.evidence) + '">' + tk(b.key) + ' · ' + esc(b.source) + '</span>' }

  function showTicket(t) {
    dtitle.innerHTML = tk(t.key, t.key + ' ↗') + ' · ' + esc(t.title) + ' <span class="status s-' + esc(t.status) + '" style="font-size:11px;padding:1px 8px;border:1px solid currentColor;border-radius:999px;margin-left:6px">' + esc(t.status) + '</span>'
    var ins = edgeList.filter(function (e) { return e.to === t.key }), outs = edgeList.filter(function (e) { return e.from === t.key })
    var h = '<div class="sec"><h3>Contract</h3>' +
      '<div class="row"><span class="lbl">Service</span><code>' + esc(t.service) + '</code></div>' +
      '<div class="row"><span class="lbl">Source</span><span class="' + (t.contractSource === 'header' ? '' : 'empty') + '">' + esc({ header: 'the plan’s ## Contract header', extracted: 'extracted from the plan’s prose (no header yet)', none: 'no Contract header, nothing extracted' }[t.contractSource] || 'extracted') + '</span></div>' +
      '<div class="row"><span class="lbl">Pull requests</span><span>' + (t.prs.length ? t.prs.map(function (pr) { return prLink(pr, true) }).join(' ') : '<span class="empty">none opened</span>') + '</span></div>' +
      '<div class="row"><span class="lbl">Blocked by</span><span>' + (t.blockedBy.length ? t.blockedBy.map(depPill).join('') : '<span class="empty">none</span>') + '</span></div>' +
      '<div class="row"><span class="lbl">Unblocks</span><span>' + (outs.length ? outs.map(function (e) { return '<span class="pill">' + tk(e.to) + '</span>' }).join('') : '<span class="empty">none</span>') + '</span></div>' +
      (t.ready ? '<div class="row"><span class="lbl"></span><span class="ready-tag" style="color:var(--changed)">every blocker is done — can start now</span></div>' : '') +
      '</div>'
    h += '<div class="sec"><h3>Provides</h3>' + (t.provides.length ? t.provides.map(function (p) {
      var users = outs.filter(function (e) { return e.ifaces.some(function (i) { return i.id === p.id }) }).map(function (e) { return e.to })
      return '<div class="iface"><span class="k" style="background:' + (KIND_COLOR[kindOf(p.id)] || 'var(--dim)') + '"></span><span class="id">' + esc(p.id) + '</span>' +
        (users.length ? '<span class="src">→ ' + users.map(esc).join(', ') + '</span>' : '<span class="src">no consumer in this epic</span>') +
        deltaHtml(p.delta) + (p.evidence ? '<div class="ev">' + esc(p.evidence) + '</div>' : '') + '</div>'
    }).join('') : '<div class="empty">none</div>') + '</div>'
    h += '<div class="sec"><h3>Consumes</h3>' + (t.consumes.length ? t.consumes.map(function (c) {
      var e = ins.filter(function (x) { return x.ifaces.some(function (i) { return i.consumer === c }) })[0]
      var i = e && e.ifaces.filter(function (x) { return x.consumer === c })[0]
      var src = c.from ? 'from ' + c.from : c.existing ? 'existing, unchanged' : (e ? 'matched to ' + e.from : 'no provider in this epic')
      return '<div class="iface"><span class="k" style="background:' + (KIND_COLOR[kindOf(c.id)] || 'var(--dim)') + '"></span><span class="id">' + esc(c.id) + '</span><span class="src">' + esc(src) + '</span>' +
        (c.delta && c.delta.length ? deltaHtml(c.delta, i && i.missing) : '') +
        (i && i.noProvider && !c.existing ? '<div class="warn">⚑ ' + esc(c.from || '') + ' does not list this interface under Provides</div>' : '') +
        (c.evidence ? '<div class="ev">' + esc(c.evidence) + '</div>' : '') + '</div>'
    }).join('') : '<div class="empty">none</div>') + '</div>'
    if (t.files.length) h += '<div class="sec files"><h3>Files named in the plan</h3>' + t.files.map(function (f) { return '<code>' + esc(f) + '</code>' }).join('') + '</div>'
    h += '<div class="sec"><h3>Evidence for its dependencies</h3>' + (t.blockedBy.length ? t.blockedBy.map(function (b) { return '<div class="row"><span class="lbl">' + esc(b.key) + '</span><span>' + depPill(b) + '<div class="ev">' + esc(b.evidence) + '</div></span></div>' }).join('') : '<div class="empty">none</div>') + '</div>'
    dbody.innerHTML = h
  }

  function showEdge(e) {
    dtitle.innerHTML = tk(e.from, e.from + ' ↗') + ' → ' + tk(e.to, e.to + ' ↗') + ' <span style="color:var(--dim);font-weight:400;font-size:12px;margin-left:8px">' + esc(e.source) + (e.done ? ' · unlocked' : ' · ' + esc(e.from) + ' not done yet') + '</span>'
    var h = '<div class="sec"><h3>Why ' + esc(e.to) + ' waits for ' + esc(e.from) + '</h3>' + (e.deps.length ? e.deps.map(function (b) { return '<div>' + depPill(b) + '<div class="ev">' + esc(b.evidence) + '</div></div>' }).join('') : '<div class="empty">only the interface below</div>') + '</div>'
    h += '<div class="sec"><h3>Interfaces on this edge</h3>' + (e.ifaces.length ? e.ifaces.map(function (i) {
      return '<div class="iface"><span class="k" style="background:' + (KIND_COLOR[kindOf(i.id)] || 'var(--dim)') + '"></span><span class="id">' + esc(i.id) + '</span>' +
        '<div class="two" style="margin-top:8px"><div><h4>' + esc(e.from) + ' provides</h4>' + (i.provider ? deltaHtml(i.provider.delta) : '<div class="warn">⚑ not listed under ' + esc(e.from) + '’s Provides</div>') + '</div>' +
        '<div><h4>' + esc(e.to) + ' reads</h4>' + deltaHtml(i.consumer.delta, i.missing) + '</div></div>' +
        (i.missing.length ? '<div class="warn">⚑ ' + esc(e.to) + ' reads ' + i.missing.map(esc).join(', ') + ' which ' + esc(e.from) + ' does not add</div>' : '') + '</div>'
    }).join('') : '<div class="empty">no interface: an ordering dependency only</div>') + '</div>'
    dbody.innerHTML = h
  }

  // ---- mismatches → Claude ----
  function sideLine(lines, field) { return (lines || []).filter(function (l) { return fieldOf(l) === field })[0] }
  function promptFor(list) {
    var out = ['Plan mismatches from Mission Control, epic ' + (PLAN.epic.key || '') + '. Make the Contract headers of these plans agree (format: docs/conventions/plan-contract.md).', '']
    list.forEach(function (x, k) {
      var e = x.e, i = x.i
      out.push((k + 1) + '. [' + x.kind + '] `' + i.id + '`')
      out.push('   provider ' + e.from + ' (' + byKey[e.from].status + ') provides: ' + (i.provider ? (i.provider.delta || []).join('; ') || '(no field listed)' : 'this interface is not under its Provides'))
      out.push('   consumer ' + e.to + ' (' + byKey[e.to].status + ') reads: ' + (x.field ? sideLine(i.consumer.delta, x.field) || x.field : (i.consumer.delta || []).join('; ') || '(no field listed)'))
      if (x.field) out.push('   field: ' + x.field)
      out.push('   fix: ' + (x.fix === 'provider' ? 'the provider plan, ' + e.from : x.fix === 'consumer' ? 'the consumer plan, ' + e.to : 'decide from both plans which side is wrong'))
      out.push('')
    })
    out.push('For each one: read both tickets with obeya_get_task_context, decide or apply the side to fix, and show me the edit to the Contract header and to the plan body it implies.')
    out.push('Do not call obeya_write_plan until I confirm. When the plan to fix belongs to a ticket that is done, propose a follow-up sub-ticket instead of rewriting a done plan.')
    return out.join('\n')
  }
  function showIssues() {
    dtitle.innerHTML = 'Mismatches · ' + issues.length
    if (!issues.length) { dbody.innerHTML = '<div class="empty">No mismatch: every consumer reads only what its provider declares.</div>'; return }
    var h = '<div class="sec">' + issues.map(function (x) {
      var e = x.e, i = x.i
      var opt = function (v, t) { return '<option value="' + v + '"' + (x.fix === v ? ' selected' : '') + '>' + esc(t) + '</option>' }
      return '<div class="iface issue"><label><input type="checkbox" data-n="' + x.n + '"' + (x.on ? ' checked' : '') + '> <b class="warn" style="margin:0">' + esc(x.kind) + '</b></label> ' +
        '<span class="pill" data-edge="' + esc(e.key) + '" style="cursor:pointer">' + esc(e.from) + ' → ' + esc(e.to) + '</span>' +
        '<select data-fix="' + x.n + '">' + opt('decide', 'let Claude decide') + opt('provider', 'fix provider · ' + e.from + (byKey[e.from].status === 'done' ? ' (done → follow-up)' : '')) + opt('consumer', 'fix consumer · ' + e.to) + '</select>' +
        '<div class="id" style="margin-top:6px">' + esc(i.id) + (x.field ? ' · <span style="color:var(--flag)">' + esc(x.field) + '</span>' : '') + '</div></div>'
    }).join('') + '</div>'
    var picked = issues.filter(function (x) { return x.on })
    h += '<div class="sec"><button id="send">Copy for Claude (' + picked.length + ')</button> <span class="empty" id="sent">In the mod this is “Send to Claude”: the prompt goes straight to the session.</span>' +
      '<h3 style="margin-top:14px">What Claude receives</h3><pre class="delta" style="padding:10px;white-space:pre-wrap">' + esc(promptFor(picked)) + '</pre></div>'
    dbody.innerHTML = h
    dbody.querySelectorAll('input[data-n]').forEach(function (c) { c.addEventListener('change', function () { issues[c.dataset.n].on = c.checked; showIssues() }) })
    dbody.querySelectorAll('select[data-fix]').forEach(function (s) { s.addEventListener('change', function () { issues[s.dataset.fix].fix = s.value; showIssues() }) })
    dbody.querySelectorAll('[data-edge]').forEach(function (p) { p.addEventListener('click', function () { select({ edge: p.dataset.edge }) }) })
    document.getElementById('send').addEventListener('click', function () {
      var text = promptFor(issues.filter(function (x) { return x.on }))
      var done = function () { document.getElementById('sent').textContent = 'Copied: paste it into Claude.' }
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, function () { window.prompt('Copy this:', text) })
      else window.prompt('Copy this:', text)
    })
  }
  document.getElementById('issues-chip').addEventListener('click', function (ev) { ev.stopPropagation(); select({ issues: true }) })

  var current = null
  function select(s) {
    current = s
    if (!s) { drawer.classList.remove('open'); highlight(null); return }
    if (s.issues) { showIssues(); drawer.classList.add('open'); highlight({ edges: issues.map(function (x) { return x.e.key }) }); return }
    if (s.ticket) showTicket(byKey[s.ticket]); else showEdge(edges[s.edge])
    drawer.classList.add('open')
    highlight(s)
  }
  function highlight(s) {
    var keep = null, keepEdges = null
    if (s && s.ticket) {
      keep = {}; keep[s.ticket] = 1; keepEdges = {}
      edgeList.forEach(function (e) { if (e.from === s.ticket || e.to === s.ticket) { keep[e.from] = keep[e.to] = 1; keepEdges[e.key] = 1 } })
    } else if (s && s.edge) {
      var e0 = edges[s.edge]; keep = {}; keep[e0.from] = keep[e0.to] = 1; keepEdges = {}; keepEdges[s.edge] = 1
    } else if (s && s.edges) {
      keep = {}; keepEdges = {}
      s.edges.forEach(function (k) { keep[edges[k].from] = keep[edges[k].to] = 1; keepEdges[k] = 1 })
    }
    tickets.forEach(function (t) {
      cards[t.key].classList.toggle('mute', !!keep && !keep[t.key])
      cards[t.key].classList.toggle('sel', !!s && s.ticket === t.key)
    })
    edgeList.forEach(function (e) {
      var x = edgeEls[e.key], on = keepEdges && keepEdges[e.key]
      x.path.setAttribute('stroke', on && !e.bad && !e.done ? '#8fa0c0' : x.col)
      x.path.setAttribute('stroke-opacity', e.done && !on ? .55 : 1)
      x.path.setAttribute('marker-end', 'url(#a-' + (e.bad ? 'bad' : e.done ? 'done' : on ? 'hot' : 'norm') + ')')
      var shown = on || (!keepEdges && !e.redundant)
      x.path.style.display = x.hit.style.display = shown || (keepEdges && !e.redundant) ? '' : 'none'
      x.path.style.opacity = keepEdges && !on ? .15 : 1
      if (x.lbl) x.lbl.style.display = on || (!keepEdges && e.bad) ? '' : 'none'
    })
  }
  highlight(null)
  document.getElementById('dclose').addEventListener('click', function () { select(null) })
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') select(null); if (ev.key === '0') fit() })

  // ---- pan / zoom ----
  var stage = document.getElementById('stage'), view = { x: 0, y: 0, k: 1 }
  function apply() { world.style.transform = 'translate(' + view.x + 'px,' + view.y + 'px) scale(' + view.k + ')' }
  function fit() {
    var r = stage.getBoundingClientRect()
    view.k = Math.min(1.1, (r.width - 40) / W, (r.height - 20) / H)
    view.x = (r.width - W * view.k) / 2; view.y = 10; apply()
  }
  stage.addEventListener('wheel', function (ev) {
    ev.preventDefault()
    var r = stage.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top
    var k = Math.min(2.5, Math.max(.25, view.k * Math.exp(-ev.deltaY * .0015)))
    view.x = px - (px - view.x) * k / view.k; view.y = py - (py - view.y) * k / view.k; view.k = k; apply()
  }, { passive: false })
  var drag = null
  stage.addEventListener('mousedown', function (ev) { if (drawer.contains(ev.target) || ev.target.closest('a')) return; drag = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y, moved: false }; stage.classList.add('drag') })
  window.addEventListener('mousemove', function (ev) { if (!drag) return; var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; view.x = drag.vx + dx; view.y = drag.vy + dy; apply() })
  window.addEventListener('mouseup', function () { if (drag && !drag.moved) select(null); drag = null; stage.classList.remove('drag') })
  stage.addEventListener('dblclick', function (ev) { if (!drawer.contains(ev.target)) fit() })
  window.addEventListener('resize', fit)
  fit()
})()
</script>
</body>
</html>
