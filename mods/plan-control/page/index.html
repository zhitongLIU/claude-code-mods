<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Control</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#0d1015; --card:#151922; --line:#2a3140; --text:#e8ebf2; --dim:#7d8698; --faint:#4b5263;
          --edge:#3a4252; --edge-hot:#8fa0c0; --read:#5aa9ff; --edit:#ffa24c; --changed:#3ddc84; --flag:#ff5fa8;
          --http:#5aa9ff; --kafka:#c792ea; --db:#ffa24c; --graphql:#ff7ab8; --email:#7fdbca; --flag-k:#ffbe3c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background-image: radial-gradient(#1a1f28 1px, transparent 1px); background-size: 22px 22px; overflow: hidden; }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  header { display: flex; align-items: center; gap: 10px; padding: 14px 20px 8px; flex-wrap: wrap; }
  h1 { margin: 0 12px 0 0; font-size: 20px; font-weight: 700; }
  .chip { padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--dim); background: rgba(255,255,255,.02); white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 600; }
  .chip.bad b { color: var(--flag); }
  .chip.link { cursor: pointer; } .chip.link:hover { border-color: var(--flag); }
  #add { min-width: 280px; background: #0b0e13; color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; font: inherit; }
  #add:focus { outline: none; border-color: #4a5a78; }
  #note { color: var(--dim); font-size: 12px; }
  .hint { margin-left: auto; color: var(--faint); font-size: 12px; }

  #legend { display: flex; gap: 16px; padding: 0 20px 8px; color: var(--dim); font-size: 12px; flex-wrap: wrap; }
  #legend span { display: inline-flex; align-items: center; gap: 6px; }
  #legend svg { overflow: visible; }

  #stage { position: relative; flex: 1; overflow: hidden; cursor: grab; }
  #stage.drag { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  #edges path.hit { pointer-events: stroke; cursor: pointer; }
  #empty[hidden] { display: none; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font-size: 14px; text-align: center; line-height: 1.8; }

  .lane { position: absolute; border: 1.5px dashed var(--line); border-radius: 18px; background: rgba(255,255,255,.015); }
  .lane-title { position: absolute; left: 18px; top: 10px; font-size: 11.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .col-title { position: absolute; font-size: 11px; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; }

  .card { position: absolute; width: 250px; height: 104px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
          cursor: pointer; transition: border-color .15s, box-shadow .15s, opacity .15s; overflow: hidden; }
  .card:hover { border-color: #4a5a78; }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .card .key { font-weight: 700; font-size: 12.5px; }
  .card .status { margin-left: auto; font-size: 10.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .card .title { margin-top: 5px; font-size: 12px; color: #c4cad6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { position: absolute; left: 14px; right: 14px; bottom: 8px; display: flex; gap: 6px; font-size: 10.5px; color: var(--dim); overflow: hidden; white-space: nowrap; }
  .card .meta span { padding: 0 6px; border-radius: 6px; background: rgba(255,255,255,.04); }
  .card .meta .bad { color: var(--flag); background: rgba(255,95,168,.1); }
  .card.done { opacity: .62; }
  .card.ready { border-color: var(--changed); box-shadow: 0 0 0 1px var(--changed), 0 0 22px rgba(61,220,132,.25); }
  .card.loading { border-style: dashed; opacity: .7; }
  .card.loading .title { color: var(--dim); font-style: italic; }
  .card.ghost { border-style: dashed; background: transparent; opacity: .75; }
  .card.ghost .title { color: var(--dim); }
  .card { cursor: grab; }
  .card .reset { margin-left: 2px; background: transparent; border: 0; color: var(--dim); cursor: pointer; font-size: 13px; padding: 0 2px; line-height: 1; }
  .card .reset:hover { color: var(--text); }
  .card.sel { border-color: #9fb4ff; box-shadow: 0 0 0 2px #9fb4ff; opacity: 1; }
  .card.mute { opacity: .25; }
  .ready-tag { color: var(--changed); font-weight: 600; }
  button.mini { background: transparent; color: var(--read); border: 1px solid var(--read); border-radius: 999px; padding: 0 8px; font: inherit; font-size: 10.5px; cursor: pointer; }
  button.mini:hover { background: rgba(90,169,255,.12); }

  .s-done { color: var(--changed); } .s-in_dev, .s-in_review, .s-in-progress { color: var(--edit); } .s-plan_review { color: var(--read); }
  .s-planning, .s-todo, .s-loading, .s-ghost, .s-ready-for-agent { color: var(--dim); } .s-blocked { color: var(--flag); }

  .elabel { position: absolute; z-index: 3; transform: translate(-50%, -50%); padding: 2px 8px; border-radius: 999px; font-size: 10.5px; white-space: nowrap;
            background: #10141b; border: 1px solid var(--edge); color: var(--dim); cursor: pointer; }
  .elabel:hover { color: var(--text); border-color: var(--edge-hot); }
  .elabel.bad { border-color: var(--flag); color: var(--flag); }
  .k { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

  #drawer { position: absolute; left: 0; right: 0; bottom: 0; height: 46%; background: #0f1319; border-top: 1px solid var(--line);
            transform: translateY(100%); transition: transform .22s ease; display: flex; flex-direction: column; z-index: 5; }
  #drawer.open { transform: none; }
  #drawer .bar { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  #drawer .bar h2 { margin: 0; font-size: 15px; }
  #drawer .bar .x { margin-left: auto; cursor: pointer; color: var(--dim); font-size: 18px; }
  #drawer .body { overflow: auto; padding: 14px 20px 30px; }
  .sec { margin: 4px 0 16px; }
  .sec h3 { margin: 0 0 8px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .row { display: flex; gap: 8px; align-items: baseline; margin: 3px 0; }
  .row .lbl { color: var(--dim); min-width: 100px; }
  .pill { display: inline-block; padding: 1px 8px; margin: 0 4px 4px 0; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; }
  .pill.declared { border-style: solid; } .pill.extracted { border-style: dashed; } .pill.inferred { border-style: dotted; color: var(--dim); }
  .iface { margin: 0 0 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .iface .id { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .iface .src { color: var(--dim); font-size: 11.5px; margin-left: 6px; }
  .delta { margin: 8px 0 0; padding: 6px 0; border-radius: 6px; background: #0b0e13; font: 12px/1.6 ui-monospace, Menlo, monospace; }
  .delta div { padding: 0 10px; white-space: pre-wrap; }
  .delta .add { color: #7ee2a8; background: rgba(61,220,132,.07); }
  .delta .chg { color: #ffd27a; background: rgba(255,190,60,.07); }
  .delta .del { color: #ff8a8a; background: rgba(255,90,90,.07); }
  .delta .miss { color: var(--flag); background: rgba(255,95,168,.12); }
  .delta .ctx { color: var(--dim); }
  .ev { margin: 6px 0 0; padding-left: 10px; border-left: 2px solid var(--line); color: #aab2c2; font-size: 12px; font-style: italic; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .two h4 { margin: 0 0 4px; font-size: 11.5px; color: var(--dim); font-weight: 600; }
  .warn { color: var(--flag); font-size: 12px; margin-top: 6px; }
  .files code { display: block; color: #aab2c2; font-size: 12px; }
  .empty { color: var(--faint); }
  .issue select { margin-left: 8px; background: #0b0e13; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font: inherit; font-size: 12px; }
  button.main { background: #2b4fd8; color: #fff; border: 0; border-radius: 8px; padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  textarea.say { width: 100%; box-sizing: border-box; min-height: 220px; resize: vertical; margin-top: 6px; background: #0b0e13; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  textarea.say:focus { outline: none; border-color: #2b4fd8; }
  .sayrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button.ghostbtn { background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; font: inherit; cursor: pointer; }
  a.pr { padding: 0 6px; border-radius: 6px; border: 1px solid currentColor; text-decoration: none; font-size: 10.5px; white-space: nowrap; }
  #drawer a.pr { font-size: 12px; padding: 1px 8px; border-radius: 999px; }
  a.pr:hover { background: rgba(255,255,255,.06); }
  .pr-open { color: var(--changed); } .pr-merged { color: #b392f0; } .pr-draft { color: var(--dim); } .pr-closed { color: var(--faint); }
  a.tk { color: inherit; text-decoration: none; }
  a.tk:hover { color: #9fb4ff; text-decoration: underline; }
</style>
</head>
<body>
<header>
  <h1>Plan Control</h1>
  <span id="chips"></span>
  <input id="add" placeholder="+ add: CAO-123, an Obeya link or a plan path" autocomplete="off">
  <button class="ghostbtn" id="refresh" title="re-read every plan file, and ask Claude to read every Obeya ticket again">↻ Refresh</button>
  <span id="note"></span>
  <span class="hint">scroll zooms · drag pans or moves a box · double-click a moved box (or r for all) puts it back · double-click fits · esc closes</span>
</header>
<div id="legend"></div>
<div id="stage">
  <div id="world"><svg id="edges"></svg></div>
  <div id="empty" hidden></div>
  <div id="drawer"><div class="bar"><h2 id="dtitle"></h2><span class="x" id="dclose">✕</span></div><div class="body" id="dbody"></div></div>
</div>

<script>
(function () {
  var CARD_W = 250, CARD_H = 104, COL_W = 330, ROW_H = 126, LANE_PAD_TOP = 40, LANE_PAD = 22, LANE_GAP = 26, LEFT = 30, TOP = 40
  var KIND_COLOR = { http: 'var(--http)', kafka: 'var(--kafka)', db: 'var(--db)', graphql: 'var(--graphql)', email: 'var(--email)', flag: 'var(--flag-k)', env: 'var(--flag-k)' }
  var RANK = { declared: 3, extracted: 2, inferred: 1 }
  var GREEN = '#3ddc84', PINK = '#ff5fa8', GREY = '#4a5468', HOT = '#8fa0c0'
  var NS = 'http://www.w3.org/2000/svg'
  var served = location.protocol.indexOf('http') === 0
  // Kept across redraws: the view, what is selected, the choices made on mismatches.
  var ui = { view: { x: 0, y: 0, k: 1 }, fitted: false, current: null, fix: {}, off: {}, W: 0, H: 0, select: function () {}, resetAll: function () {},
             moved: {}, cardDrag: null, dragged: false,
             drafts: {} } // drafts: the prompt text edited by hand, per composer → { text, base }, base the machine text it started from // moved: boxes dragged on this page, key → {x, y}, or null once put back

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] }) }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n }
  function kindOf(id) { return String(id).split(' ')[0] }
  function shortId(id) {
    var p = String(id).split(' ')
    if (p[0] === 'http') return p[2] + ' ' + p.slice(3).join(' ').replace(/^\/api\/v\d+\//, '…/')
    if (p[0] === 'kafka') return p.slice(1).join(' ')
    return p.slice(2).join(' ') || p.slice(1).join(' ')
  }
  // the field a delta line is about, as the mod reads it (build.ts fieldOf / sameField)
  function fieldOf(line) { var m = /^[+~-]\s*(?:(?:header|body|query|param|payload|request|response(?:\s+\d+)?)[\s.]+)?([^:#\s,(]+)/i.exec(String(line).trim()); return m ? m[1] : null }
  function inList(f, list) { return (list || []).some(function (x) { return x === f || x.slice(-f.length - 1) === '.' + f || f.slice(-x.length - 1) === '.' + x }) }
  function opOf(line) { var c = String(line).trim()[0]; return c === '+' ? 'add' : c === '~' ? 'chg' : c === '-' ? 'del' : 'ctx' }

  function post(name, body) {
    if (!served) return Promise.reject(new Error('no server'))
    return fetch(location.pathname.replace(/[^/]*$/, '') + name, { method: 'POST', body: JSON.stringify(body) }).then(function (r) { if (!r.ok) throw new Error(String(r.status)) })
  }
  function note(text) { document.getElementById('note').textContent = text }
  // asks Claude to read the tickets again from Obeya: 'all', or one key
  function refresh(what) {
    post('refresh', { id: what }).then(function () { note('refreshing ' + (what === 'all' ? 'every ticket' : what.split('/').pop()) + ': plan files now, Obeya tickets once Claude reads them') }, function () { note('No server: run /plan-control refresh ' + what) })
  }
  document.getElementById('refresh').addEventListener('click', function () { refresh('all') })

  document.getElementById('add').addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return
    var v = ev.target.value.trim()
    if (!v) return
    post('add', { text: v }).then(function () { ev.target.value = ''; note('added: ' + v) }, function () { note('No server: run /plan-control add ' + v) })
  })

  // ---- one full drawing of the plan ----
  function render(PLAN) {
    var tickets = (PLAN.tickets || []).map(function (t) { return Object.assign({}, t) })
    var alias = PLAN.aliases || {}
    var real = function (k) { return alias[k] || k }
    var byKey = {}
    tickets.forEach(function (t) { byKey[t.key] = t; ['provides', 'consumes', 'blockedBy', 'files', 'prs'].forEach(function (f) { t[f] = t[f] || [] }) })

    // Tickets the map names but does not hold: ghosts, each with an add button.
    var refs = {}
    tickets.forEach(function (t) {
      t.blockedBy.forEach(function (b) { refs[real(b.key)] = 1 })
      t.consumes.forEach(function (c) { if (c.from) refs[real(c.from)] = 1 })
    })
    // A ghost that is a plan file next to one on the map opens that file, and + add adds the file.
    var nearby = PLAN.nearby || {}
    Object.keys(refs).forEach(function (k) {
      var local = Object.prototype.hasOwnProperty.call(nearby, k) ? nearby[k] : undefined
      if (byKey[k] || !(local || /^[A-Z][A-Z0-9]+-\d+$/.test(k))) return
      var g = { key: k, kind: 'ghost', title: 'not on the map', status: 'ghost', service: 'not on the map', provides: [], consumes: [], blockedBy: [], files: [], prs: [], path: local && local.path, url: local ? local.url : (PLAN.ticketUrl || '').replace('{key}', k) }
      tickets.push(g); byKey[k] = g
    })

    var providersOf = {}
    tickets.forEach(function (t) { t.provides.forEach(function (p) { (providersOf[p.id] = providersOf[p.id] || []).push(t.key) }) })
    var edges = {}
    function edge(from, to) {
      from = real(from); to = real(to)
      if (from === to || !byKey[from] || !byKey[to]) return null
      var k = from + '→' + to
      return edges[k] = edges[k] || { key: k, from: from, to: to, deps: [], ifaces: [] }
    }
    tickets.forEach(function (t) {
      t.blockedBy.forEach(function (b) { var e = edge(b.key, t.key); if (e) e.deps.push(b) })
      // An (existing, unchanged) interface is not matched to a provider. The field checks come from the mod (checks).
      t.consumes.forEach(function (c) {
        var froms = c.from ? [c.from] : c.existing ? [] : (providersOf[c.id] || []).filter(function (k) { return k !== t.key })
        froms.forEach(function (f) {
          var e = edge(f, t.key)
          if (!e) return
          var from = byKey[real(f)]
          var prov = (from.provides || []).filter(function (p) { return p.id === c.id })[0]
          var chk = (c.checks || {})[real(f)] || { missing: [], removed: [], noProvider: false, unchecked: from.kind === 'ghost' || from.status === 'loading' }
          e.ifaces.push({ id: c.id, consumer: c, provider: prov || null, missing: chk.missing, removed: chk.removed, noProvider: chk.noProvider, unchecked: chk.unchecked, suggestion: chk.suggestion })
          if (!c.from) e.deps.push({ key: f, source: 'inferred', evidence: 'same interface id provided by ' + f })
        })
      })
    })
    var edgeList = Object.keys(edges).map(function (k) { return edges[k] })
    edgeList.forEach(function (e) {
      e.source = e.deps.reduce(function (best, d) { return RANK[d.source] > RANK[best] ? d.source : best }, e.ifaces.some(function (i) { return i.consumer.from }) ? 'declared' : 'inferred')
      e.done = byKey[e.from].status === 'done'
      e.bad = e.ifaces.some(function (i) { return i.missing.length || i.noProvider })
    })
    // An ordering edge a longer path already implies is drawn only when its ticket is selected.
    function reaches(from, to, skip) {
      var seen = {}, stack = [from]
      while (stack.length) {
        var k = stack.pop()
        edgeList.forEach(function (e) { if (e.from === k && e.key !== skip && !seen[e.to]) { seen[e.to] = 1; stack.push(e.to) } })
      }
      return !!seen[to]
    }
    edgeList.forEach(function (e) { e.redundant = !e.ifaces.length && reaches(e.from, e.to, e.key) })
    tickets.forEach(function (t) {
      var ins = edgeList.filter(function (e) { return e.to === t.key })
      t.ready = t.kind !== 'ghost' && t.status !== 'done' && t.status !== 'loading' && ins.every(function (e) { return e.done })
      t.external = t.consumes.filter(function (c) { return c.existing || (!c.from && !(providersOf[c.id] || []).some(function (k) { return k !== t.key })) })
      t.bad = ins.some(function (e) { return e.bad })
    })
    var issues = []
    edgeList.forEach(function (e) {
      e.ifaces.forEach(function (i) {
        if (i.noProvider) return issues.push({ kind: 'missing interface', e: e, i: i })
        i.missing.forEach(function (f) { issues.push({ kind: i.removed.indexOf(f) >= 0 ? 'removed field still read' : 'missing field', e: e, i: i, field: f }) })
      })
    })
    issues.forEach(function (x, n) { x.n = n; x.sig = x.e.key + '|' + x.i.id + '|' + (x.field || ''); x.on = !ui.off[x.sig]; x.fix = ui.fix[x.sig] || 'decide' })

    // ---- layout: columns by dependency depth, one lane per service ----
    var depth = {}
    tickets.forEach(function (t) { depth[t.key] = 0 })
    for (var pass = 0; pass < tickets.length; pass++) {
      var moved = false
      // capped, so a dependency cycle cannot push columns out forever; its edges are drawn going back
      edgeList.forEach(function (e) { if (depth[e.from] + 1 > depth[e.to] && depth[e.from] + 1 < 8) { depth[e.to] = depth[e.from] + 1; moved = true } })
      if (!moved) break
    }
    var services = []
    tickets.forEach(function (t) { if (services.indexOf(t.service) < 0) services.push(t.service) })
    var order = PLAN.serviceOrder || []
    var rank = function (s) { return s === 'not on the map' ? 999 : order.indexOf(s) < 0 ? 99 : order.indexOf(s) }
    services.sort(function (a, b) { return rank(a) - rank(b) })
    var maxDepth = tickets.length ? Math.max.apply(null, tickets.map(function (t) { return depth[t.key] })) : 0
    var pos = {}, lanes = [], y = TOP + 22
    services.forEach(function (s) {
      var inLane = tickets.filter(function (t) { return t.service === s })
      var stacks = {}
      inLane.forEach(function (t) { (stacks[depth[t.key]] = stacks[depth[t.key]] || []).push(t) })
      var rows = Math.max.apply(null, Object.keys(stacks).map(function (d) { return stacks[d].length }))
      Object.keys(stacks).forEach(function (d) { stacks[d].forEach(function (t, i) { pos[t.key] = { x: LEFT + LANE_PAD + Number(d) * COL_W, y: y + LANE_PAD_TOP + i * ROW_H } }) })
      var h = LANE_PAD_TOP + rows * ROW_H - (ROW_H - CARD_H) + LANE_PAD
      lanes.push({ name: s, y: y, h: h, n: inLane.length })
      y += h + LANE_GAP
    })
    var W = LEFT + LANE_PAD * 2 + (maxDepth + 1) * COL_W - (COL_W - CARD_W), H = y
    ui.W = W; ui.H = H
    // Boxes the person dragged: what this page just moved, else what the map file holds. null = put back.
    var saved = PLAN.positions || {}
    tickets.forEach(function (t) {
      var o = t.key in ui.moved ? ui.moved[t.key] : saved[t.key]
      if (o) { pos[t.key] = { x: o.x, y: o.y }; t.moved = true }
    })

    // ---- draw ----
    var world = document.getElementById('world'), svg = document.getElementById('edges')
    Array.prototype.slice.call(world.children).forEach(function (n) { if (n !== svg) world.removeChild(n) })
    while (svg.firstChild) svg.removeChild(svg.firstChild)
    world.style.width = W + 'px'; world.style.height = H + 'px'
    svg.setAttribute('width', W); svg.setAttribute('height', H)
    var empty = document.getElementById('empty')
    empty.hidden = tickets.length > 0
    empty.innerHTML = (PLAN.missing || []).length ? 'Reading ' + esc(PLAN.missing.join(', ')) + ' from Obeya…' : 'The map is empty.<br>Type a ticket key, an Obeya link or a plan path in <b>+ add</b>, or run <code>/plan-control add CAO-219</code>.'

    function tk(t, text) {
      var label = esc(text == null ? t.key : text)
      return t.url ? '<a class="tk" href="' + esc(t.url) + '" target="_blank" rel="noopener" title="open ' + esc(t.path || t.key) + '">' + label + '</a>' : label
    }

        var e = x.e, i = x.i
        var opt = function (v, t) { return '<option value="' + v + '"' + (x.fix === v ? ' selected' : '') + '>' + esc(t) + '</option>' }
        return '<div class="iface issue"><label><input type="checkbox" data-n="' + x.n + '"' + (x.on ? ' checked' : '') + '> <b class="warn" style="margin:0">' + esc(x.kind) + '</b></label> ' +
          '<span class="pill" data-edge="' + esc(e.key) + '" style="cursor:pointer">' + esc(e.from) + ' → ' + esc(e.to) + '</span>' +
          '<select data-fix="' + x.n + '">' + opt('decide', 'let Claude decide') + opt('provider', 'fix provider · ' + e.from + (byKey[e.from].status === 'done' ? ' (done → follow-up)' : '')) + opt('consumer', 'fix consumer · ' + e.to) + '</select>' +
          '<div class="id" style="margin-top:6px">' + esc(i.id) + (x.field ? ' · <span style="color:var(--flag)">' + esc(x.field) + '</span>' : '') + '</div></div>'
      }).join('') + '</div>'
      var picked = issues.filter(function (x) { return x.on })
      h += '<div class="sec"><h3>What Claude receives</h3>' + composer('issues', picked) + '</div>'
      dbody.innerHTML = h
      dbody.querySelectorAll('input[data-n]').forEach(function (c) { c.addEventListener('change', function () { var x = issues[c.dataset.n]; x.on = c.checked; ui.off[x.sig] = !c.checked; showIssues() }) })
      dbody.querySelectorAll('select[data-fix]').forEach(function (s) { s.addEventListener('change', function () { var x = issues[s.dataset.fix]; x.fix = s.value; ui.fix[x.sig] = s.value; showIssues() }) })
      dbody.querySelectorAll('[data-edge]').forEach(function (p) { p.addEventListener('click', function () { select({ edge: p.dataset.edge }) }) })
      bindComposer('issues', picked)
    }
    function bindAdd() {
      dbody.querySelectorAll('button[data-add]').forEach(function (b) {
        b.addEventListener('click', function () { post('add', { text: b.dataset.add }).then(function () { note('added: ' + b.dataset.add) }, function () { note('No server: run /plan-control add ' + b.dataset.add) }) })
      })
    }

    function highlight(s) {
      var keep = null, keepEdges = null
      if (s && s.ticket && byKey[s.ticket]) {
        keep = {}; keep[s.ticket] = 1; keepEdges = {}
        edgeList.forEach(function (e) { if (e.from === s.ticket || e.to === s.ticket) { keep[e.from] = keep[e.to] = 1; keepEdges[e.key] = 1 } })
      } else if (s && s.edge && edges[s.edge]) {
        var e0 = edges[s.edge]; keep = {}; keep[e0.from] = keep[e0.to] = 1; keepEdges = {}; keepEdges[s.edge] = 1
      } else if (s && s.issues) {
        keep = {}; keepEdges = {}
        issues.forEach(function (x) { keep[x.e.from] = keep[x.e.to] = 1; keepEdges[x.e.key] = 1 })
      }
      tickets.forEach(function (t) {
        cards[t.key].classList.toggle('mute', !!keep && !keep[t.key])
        cards[t.key].classList.toggle('sel', !!s && s.ticket === t.key)
      })
      edgeList.forEach(function (e) {
        var x = edgeEls[e.key], on = keepEdges && keepEdges[e.key]
        var shown = on || (!keepEdges && !e.redundant) || (keepEdges && !e.redundant)
        x.path.style.display = x.hit.style.display = shown ? '' : 'none'
        x.path.setAttribute('stroke', on && !e.bad && !e.done ? HOT : x.col)
        x.path.setAttribute('stroke-opacity', e.done && !on ? .55 : 1)
        x.path.setAttribute('marker-end', 'url(#a-' + (e.bad ? 'bad' : e.done ? 'done' : on ? 'hot' : 'norm') + ')')
        x.path.style.opacity = keepEdges && !on ? .15 : 1
        if (x.lbl) x.lbl.style.display = on || (!keepEdges && e.bad) ? '' : 'none'
      })
    }

    function select(s) {
      if (s && s.ticket && !byKey[s.ticket]) s = null
      if (s && s.edge && !edges[s.edge]) s = null
      ui.current = s
      if (!s) { drawer.classList.remove('open'); highlight(null); return }
      if (s.issues) showIssues()
      else if (s.ticket) showTicket(byKey[s.ticket])
      else showEdge(edges[s.edge])
      drawer.classList.add('open')
      highlight(s)
    }
    ui.select = select
    // the redraw keeps what was selected, unless it left the map
    select(ui.current)
    if (!ui.fitted && tickets.length) { fit(); ui.fitted = true } else apply()
  }

  // ---- pan / zoom, set up once ----
  var stage = document.getElementById('stage'), world = document.getElementById('world'), drawer = document.getElementById('drawer')
  function apply() { world.style.transform = 'translate(' + ui.view.x + 'px,' + ui.view.y + 'px) scale(' + ui.view.k + ')' }
  function fit() {
    var r = stage.getBoundingClientRect()
    if (!ui.W || !ui.H) return
    ui.view.k = Math.min(1.1, (r.width - 40) / ui.W, (r.height - 20) / ui.H)
    ui.view.x = (r.width - ui.W * ui.view.k) / 2; ui.view.y = 10; apply()
  }
  stage.addEventListener('wheel', function (ev) {
    if (drawer.contains(ev.target)) return
    ev.preventDefault()
    var r = stage.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top, v = ui.view
    var k = Math.min(2.5, Math.max(.25, v.k * Math.exp(-ev.deltaY * .0015)))
    v.x = px - (px - v.x) * k / v.k; v.y = py - (py - v.y) * k / v.k; v.k = k; apply()
  }, { passive: false })
  var drag = null
  stage.addEventListener('mousedown', function (ev) { if (drawer.contains(ev.target) || ev.target.closest('a,button')) return; drag = { x: ev.clientX, y: ev.clientY, vx: ui.view.x, vy: ui.view.y, moved: false }; stage.classList.add('drag') })
  window.addEventListener('mousemove', function (ev) {
    var cd = ui.cardDrag
    if (cd) {
      var bx = ev.clientX - cd.sx, by = ev.clientY - cd.sy
      if (!cd.moved && Math.abs(bx) + Math.abs(by) <= 3) return
      cd.moved = true
      stage.classList.add('drag')
      return cd.move(bx, by)
    }
    if (!drag) return; var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; ui.view.x = drag.vx + dx; ui.view.y = drag.vy + dy; apply()
  })
  window.addEventListener('mouseup', function () {
    var cd = ui.cardDrag
    ui.cardDrag = null
    if (cd) {
      stage.classList.remove('drag')
      if (cd.moved) { ui.dragged = true; cd.end(); setTimeout(function () { ui.dragged = false }, 0) } // the click that follows is not a click
      return
    }
    if (drag && !drag.moved) ui.select(null); drag = null; stage.classList.remove('drag')
  })
  stage.addEventListener('dblclick', function (ev) { if (!drawer.contains(ev.target)) fit() })
  document.getElementById('dclose').addEventListener('click', function () { ui.select(null) })
  document.addEventListener('keydown', function (ev) { if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA' || ev.target.tagName === 'SELECT') return; if (ev.key === 'Escape') ui.select(null); if (ev.key === '0') fit(); if (ev.key === 'r') ui.resetAll() })
  window.addEventListener('resize', fit)

  // ---- data.js, re-read every second; a change redraws ----
  var last = ''
  function load() {
    var s = document.createElement('script')
    s.src = 'data.js?t=' + Date.now()
    s.onload = s.onerror = function () {
      s.remove()
      var plan = window.PLAN
      var text = plan ? JSON.stringify(plan) : ''
      var typing = document.activeElement && document.activeElement.tagName === 'TEXTAREA'
      if (text && text !== last && !ui.cardDrag && !typing) { // a redraw waits for the box being dragged to land, and for the prompt being typed
        last = text
        document.title = (plan.title ? plan.title + ' · ' : '') + 'Plan Control'
        try { render(plan) } catch (err) { note('Could not draw the map: ' + err.message) }
      }
      setTimeout(load, 1000)
    }
    document.head.appendChild(s)
  }
  load()
})()
</script>
</body>
</html>
